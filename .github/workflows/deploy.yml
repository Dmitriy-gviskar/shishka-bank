name: deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shishka
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shishka_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
        env:
          DATABASE_URL: postgres://shishka:test@localhost:5432/shishka_test
          PARENT_PIN: testpin
          PGHOST: localhost
          PGUSER: shishka
          PGPASSWORD: test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: root
          SOURCE: "client/"
          TARGET: "/opt/shishka/"
          EXCLUDE: "node_modules/, uploads/, .DS_Store, package-lock.json"
          SCRIPT_AFTER: |
            systemctl restart shishka
            systemctl is-active shishka || (echo "DEPLOY FAILED: service not active" && exit 1)
            curl -sf http://127.0.0.1:3777/api/ping || (echo "DEPLOY FAILED: ping failed" && exit 1)
            echo "Deploy OK"
