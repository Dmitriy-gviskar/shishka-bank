name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: root
          SOURCE: "client/"
          TARGET: "/opt/shishka/"
          EXCLUDE: "node_modules/, uploads/, .DS_Store, package-lock.json"
          SCRIPT_AFTER: |
            systemctl restart shishka
            curl -sf http://127.0.0.1:3777/api/ping || exit 1
