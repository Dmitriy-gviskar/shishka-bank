name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ apk ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # квота Actions-артефактов бывает исчерпана — релиз ниже не зависит от неё
        with:
          name: shishka-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - run: |
          gh release create "build-${{ github.run_id }}" android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" --title "APK build ${{ github.run_id }}" \
            --notes "Автосборка из ветки apk" --latest
        env:
          GH_TOKEN: ${{ github.token }}
