<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лиса ASCENDED — Шишка Банк</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #info {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: #ffd700; font-size: 18px; font-weight: 600;
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
    pointer-events: none; z-index: 10;
  }
  #status {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #ccc; font-size: 16px; z-index: 10; text-align: center;
    background: rgba(0,0,0,0.6); padding: 16px 28px; border-radius: 8px;
    max-width: 500px;
  }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.35); font-size: 13px;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<div id="info">ЛИСА ASCENDED</div>
<div id="status">Загрузка Three.js...</div>
<div id="hint">Вращение — левая кнопка · Приближение — колёсико</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
const statusEl = document.getElementById('status');

function log(msg, ok) {
  statusEl.innerHTML += '<br>' + msg;
  if (ok === false) statusEl.style.color = '#ff6b6b';
  console.log(msg);
}

try {
  log('Загрузка Three.js...');

  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');

  log('Three.js загружен ✓');

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#1a1a2e');
  scene.fog = new THREE.Fog('#1a1a2e', 8, 30);

  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 50);
  camera.position.set(3, 2.5, 5);
  camera.lookAt(0, 1.2, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.2, 0);
  controls.minDistance = 1.5;
  controls.maxDistance = 12;
  controls.enableDamping = true;
  controls.update();

  // Lights
  scene.add(new THREE.AmbientLight('#b8c8ff', 1.8));
  const key = new THREE.DirectionalLight('#ffffff', 8);
  key.position.set(5, 8, 4);
  scene.add(key);
  scene.add(new THREE.DirectionalLight('#ffd4a0', 3)).position.set(-3, 2, -2);
  scene.add(new THREE.DirectionalLight('#80a0ff', 4)).position.set(0, 1, -5);
  const glow = new THREE.PointLight('#ffb040', 15, 5);
  glow.position.set(0, 0, 1);
  scene.add(glow);

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 20),
    new THREE.MeshStandardMaterial({ color:'#1a1a2e', roughness:0.6 })
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -2;
  scene.add(ground);

  // Particles
  const pGeo = new THREE.BufferGeometry();
  const n = 200, arr = new Float32Array(n*3);
  for(let i=0;i<n;i++){ arr[i*3]=(Math.random()-0.5)*6; arr[i*3+1]=Math.random()*5; arr[i*3+2]=(Math.random()-0.5)*6; }
  pGeo.setAttribute('position', new THREE.BufferAttribute(arr,3));
  const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
    color:'#ffd700', size:0.03, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.6, transparent:true
  }));
  scene.add(particles);

  // Load model
  log('Загрузка модели fox_ascended.glb...');
  const loader = new GLTFLoader();

  const gltf = await new Promise((resolve, reject) => {
    loader.load('./v2/fox_ascended_v2.glb', resolve,
      (xhr) => {
        if(xhr.total) statusEl.textContent = 'Загрузка модели… '+Math.round(xhr.loaded/xhr.total*100)+'%';
      },
      reject
    );
  });

  log('Модель загружена ✓');
  statusEl.style.display = 'none';

  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  const sz = box.getSize(new THREE.Vector3());
  const s = 4 / Math.max(sz.x, sz.y, sz.z);
  model.scale.setScalar(s);
  model.position.set(-c.x*s, -box.min.y*s, -c.z*s);
  model.traverse(n => { if(n.isMesh) { n.castShadow = true; n.receiveShadow = true; }});
  scene.add(model);

  ground.position.y = -box.min.y*s - 0.1;
  glow.position.y = -box.min.y*s + 0.3;

  log('Сцена готова. Моделей в сцене: ' + model.children.length);

  // Loop
  const clock = new THREE.Clock();
  (function loop() {
    requestAnimationFrame(loop);
    const t = clock.getElapsedTime();
    controls.update();
    particles.rotation.y += 0.0008;
    glow.intensity = 15 + Math.sin(t*0.8)*3;
    renderer.render(scene, camera);
  })();

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

} catch(err) {
  log('ОШИБКА: ' + err.message, false);
  console.error(err);
}
</script>
</body>
</html>
