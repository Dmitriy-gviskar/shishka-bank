<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7bab4c"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Лесная почта</title><link rel="stylesheet" href="style.css">
<style>
  .phone{background-image:url(assets/bg.webp)}
  .wrap{display:flex;flex-direction:column;height:100%;padding:0;position:relative}
  .title{flex:none;margin:8px 0 4px}
  /* Список чатов */
  #chatList{flex:1;overflow-y:auto;min-height:0;padding:6px 8px;display:flex;flex-direction:column;gap:6px}
  #chatList::-webkit-scrollbar{width:0}
  .chatRow{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;
    background:#fffef9;border:2px solid #e0d3b8;border-radius:14px;transition:all .12s}
  .chatRow:active{background:#f2ebd8;border-color:#c9b88a}
  .chatRow .ava{position:relative;flex:none}
  .chatRow img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#d5cfbe;border:2px solid #e0d3b8;display:block}
  .chatRow .ava .dot{position:absolute;bottom:1px;right:1px;width:13px;height:13px;
    background:#6db83a;border:2px solid #fffef9;border-radius:50%}
  .chatRow .info{flex:1;min-width:0}
  .chatRow .name{font-weight:900;color:#4a3520;font-size:15px}
  .chatRow .preview{font-size:13px;color:#6b5a44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .chatRow .meta{text-align:right;flex:none}
  .chatRow .time{font-size:11px;color:#8a7a65;font-weight:700}
  .chatRow .badge{display:inline-block;background:var(--green);color:#fff;font-weight:800;font-size:11px;
    min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px;padding:0 5px;margin-top:3px}
  .noChats{text-align:center;color:var(--brown);font-weight:800;padding:30px 16px;font-size:15px;
    background:#fffaf0;border:2px solid #e0d3b8;border-radius:16px;margin:10px;line-height:1.5}
  /* Детальный чат — скрыт по умолчанию */
  #chatDetail{flex:1;display:none;flex-direction:column;min-height:0}
  #chatDetail.open{display:flex}
  #chatHeader{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fffaf0;border-bottom:2px solid #e0d3b8}
  #chatHeader .back{background:none;border:2px solid #d9c39a;border-radius:12px;padding:4px 10px;font-size:18px;font-weight:900;color:var(--brown);cursor:pointer}
  #chatHeader .chName{flex:1;font-weight:800;color:var(--brown);font-size:15px}
  #chatHeader .payBtn{background:var(--gold);color:#5b4636;border:none;border-radius:12px;padding:5px 12px;font-weight:800;font-size:13px;cursor:pointer}
  #chatMsgs{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0}
  #chatMsgs::-webkit-scrollbar{width:0}
  .msgBubble{max-width:82%;padding:8px 12px;border-radius:14px;font-size:14px;font-weight:700;line-height:1.4;word-break:break-word}
  .msgBubble.mine{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:3px}
  .msgBubble.theirs{align-self:flex-start;background:#fff;color:var(--ink);border:2px solid #e0d3b8;border-bottom-left-radius:3px}
  .msgTime{font-size:10px;font-weight:600;opacity:.6;margin-top:2px;text-align:right}
  .emptyChat{text-align:center;color:var(--brown);font-weight:800;padding:24px 16px;font-size:15px;
    background:#fffaf0;border:2px solid #e0d3b8;border-radius:16px;margin:10px;line-height:1.5}
  /* Нижняя панель ввода */
  #chatInput{flex:none;position:sticky;bottom:0;z-index:5;background:#fffaf2;border-top:2px solid #e0d3b8;padding:6px 8px 8px}
  #phraseBar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;justify-content:center}
  #phraseBar button{background:#fff;border:2px solid #d9c39a;border-radius:12px;padding:5px 10px;
    font-size:12px;font-weight:700;color:var(--brown);cursor:pointer;white-space:nowrap;transition:all .1s}
  #phraseBar button:active{background:#e8dcc8}
  /* Стикеры */
  #stickerBar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;justify-content:center}
  #stickerBar button{background:#fffef9;border:2px solid #e0d3b8;border-radius:14px;padding:6px 8px;
    font-size:26px;cursor:pointer;line-height:1;transition:all .1s}
  #stickerBar button:active{background:#f0e8d0;transform:scale(.92)}
  .msgSticker{font-size:48px;text-align:center;padding:4px 0;line-height:1}
  .msgSticker.mine{align-self:flex-end}
  .msgSticker.theirs{align-self:flex-start}
  /* Реакции */
  .rxRow{display:flex;gap:3px;margin-top:1px}
  .rxRow.mine{justify-content:flex-end}
  .rxChip{background:#fffef9;border:1.5px solid #e0d3b8;border-radius:10px;padding:1px 6px;
    font-size:13px;line-height:1.3;cursor:pointer;transition:all .1s;display:flex;gap:2px;align-items:center}
  .rxChip .cnt{font-size:10px;font-weight:700;color:#8a7a65}
  #rxPicker{display:none;position:fixed;z-index:50;background:#fffef9;border:2px solid #e0d3b8;border-radius:14px;
    padding:6px 8px;gap:4px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
  #rxPicker button{background:none;border:none;font-size:28px;padding:4px 6px;cursor:pointer;border-radius:10px;transition:all .1s}
  #rxPicker button:active{background:#f0e8d0;transform:scale(1.25)}
  /* Ответ / цитата */
  .replyQuote{background:#e8f0d8;border-left:3px solid var(--green);border-radius:0 10px 10px 0;
    padding:3px 10px;margin:2px 0 4px;font-size:11px;color:#5f7a38;font-weight:700;max-width:90%}
  .replyQuote .by{color:#8a9a6a;font-size:10px;margin-bottom:1px}
  #replyBar{display:none;align-items:center;background:#f0f5e8;border-top:2px solid #c8d9b0;padding:6px 10px;gap:8px}
  #replyBar .txt{flex:1;font-size:12px;color:#5f7a38;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #replyBar button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--brown)}
  #inputRow{display:flex;gap:6px}
  #inputRow input{flex:1;min-width:0;border:2px solid #d9c39a;border-radius:12px;padding:8px 12px;
    font-size:16px;font-family:inherit;font-weight:600;color:var(--ink);outline:none;background:#fff}
  #inputRow input:focus{border-color:var(--green)}
  #inputRow button{background:var(--green);color:#fff;border:none;border-radius:12px;
    padding:8px 16px;font-weight:800;font-size:14px;cursor:pointer}
  #micBtn{width:40px;height:40px;border-radius:50%;background:#e8dcc8;border:2px solid #d9c39a;
    font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  #micBtn.recording{background:#e04545;border-color:#c03030;animation:pulse .8s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,69,69,.5)}50%{box-shadow:0 0 0 12px rgba(224,69,69,0)}}
  #recTime{font-size:11px;font-weight:700;color:#c03030;display:none}
  .playAudio{background:var(--green);color:#fff;border:none;border-radius:14px;padding:10px 20px;
    font-size:16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .playAudio:active{transform:scale(.95)}
  /* Попап перевода шишек */
  #payPopup{display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;background:rgba(0,0,0,.4);
    justify-content:center;align-items:center}
  #payPopup.open{display:flex}
  #payPopup .card{width:260px;text-align:center}
  #payPopup .amts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
  #payPopup .amts button{background:#fff7e8;border:2px solid #d9c39a;border-radius:10px;padding:6px 14px;
    font-weight:800;color:var(--brown);cursor:pointer;font-size:15px}
  #payPopup .amts button.sel{border-color:var(--green);background:#e8f0d8}
  #payPopup .doPay{background:var(--gold);color:#5b4636;border:none;border-radius:12px;padding:8px 24px;
    font-weight:800;font-size:15px;cursor:pointer;margin-top:6px}
  #payPopup .cancel{background:none;border:none;color:#a09080;font-weight:700;font-size:13px;cursor:pointer;margin-top:6px}
</style></head><body>
<div class="phone"><div class="wrap">
  <div class="title">Лесная почта</div>
  <!-- Список чатов -->
  <div id="chatList"></div>
  <!-- Детальный чат -->
  <div id="chatDetail">
    <div id="chatHeader">
      <button class="back" id="btnBack">←</button>
      <span class="chName" id="chName"></span>
      <button class="payBtn" id="btnPay">💳</button>
    </div>
    <div id="chatMsgs"></div>
    <div id="replyBar"><span class="txt" id="replyTxt"></span><button id="replyCancel">✕</button></div>
    <div id="chatInput">
      <div id="stickerBar"></div>
      <div id="phraseBar"></div>
      <div id="inputRow">
        <button id="micBtn">🎤</button>
        <input type="text" id="msgInput" placeholder="Сообщение..." maxlength="80" autocomplete="off">
        <span id="recTime">0:00</span>
        <button id="btnSend">→</button>
      </div>
    </div>
  </div>
  <!-- Попап перевода -->
  <div id="payPopup">
    <div class="card">
      <div style="font-weight:800;color:var(--brown);font-size:15px;margin-bottom:4px">Перевести шишки</div>
      <div style="font-size:12px;color:#8a7a65" id="payToName"></div>
      <div class="amts" id="payAmts"></div>
      <button class="doPay" id="btnDoPay">Отправить</button><br>
      <button class="cancel" id="btnPayCancel">Отмена</button>
    </div>
  </div>
  <!-- Пикер реакций -->
  <div id="rxPicker"><button>❤️</button><button>🔥</button><button>😂</button><button>👍</button><button>😢</button></div>
</div></div>
<script src="app.js"></script>
<script src="nav.js"></script>
</body></html>
