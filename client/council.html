<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6fad45"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Лесной Совет</title><link rel="stylesheet" href="style.css">
<style>
  /* bg: global cozy */
  .sub{background:rgba(255,248,235,.94);border:2.5px solid #fff;border-radius:14px;padding:7px 14px;
    align-self:center;margin-bottom:6px;text-align:center;color:var(--ink);font-weight:700;font-size:14px;
    box-shadow:0 0 0 2px #c9a86a;width:fit-content}
  #props{flex:1 1 auto;min-height:0;overflow-y:auto}#props::-webkit-scrollbar{width:0}
  .prop{margin-top:10px;padding:13px}
  .prop .t{font-weight:900;color:var(--ink);font-size:16px;line-height:1.2}
  .prop .row{display:flex;align-items:center;gap:8px;margin-top:10px}
  .prop .tally{flex:1;font-weight:800;color:var(--brown);font-size:14px}
  .vbtn{border:none;border-radius:12px;padding:8px 16px;font-weight:900;cursor:pointer;font-size:14px}
  .yes{background:#8ec44f;color:#fff}.no{background:#e0a99a;color:#5b4636}
  .prop-form{margin:6px 0 4px;padding:10px;display:flex;gap:8px;align-items:center}
  .prop-form input{flex:1;min-width:0;background:#fffaf0;border:3px solid #fff;border-radius:12px;
    padding:10px;font-size:14px;font-weight:800;color:var(--ink);outline:none;
    box-shadow:0 0 0 2px #c9a86a;font-family:"Fredoka","Nunito",sans-serif}
  .prop-form button{flex:none;padding:10px 12px;font-size:13px;white-space:nowrap}
</style></head><body>
<div class="phone"><div class="wrap">
  <div class="title">Лесной Совет</div>
  <div class="sub">Голосуем всей семьёй — 1 ребёнок, 1 голос</div>
  <div class="prop-form card">
    <input id="propTitle" placeholder="Предложи тему семье" maxlength="80">
    <button class="btn btn-sm" id="propBtn" type="button">Предложить</button>
  </div>
  <div id="props"></div>
  <div id="note" class="page-note"></div>
</div></div>
<script src="app.js"></script>
<script src="nav.js"></script>
</body></html>
