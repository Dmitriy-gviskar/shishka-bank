<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7bab4c"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Переводы</title><link rel="stylesheet" href="style.css">
<style>
  .phone{background-image:url(assets/bg.webp)}
  .friends{margin-top:8px}
  .friend{background:#fbf4e2;border:3px solid #d9c39a;border-radius:16px;padding:8px 4px;text-align:center}
  .friend.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,182,75,.35)}
  .friend img{width:66px;height:66px;object-fit:contain}
  .friend span{display:block;font-weight:800;color:var(--brown);font-size:13px;margin-top:2px}
  .amount{margin-top:12px;text-align:center;background:#fbf4e2;border:3px solid #d9c39a;border-radius:16px;padding:10px}
  .amount .n{font-size:46px;font-weight:900;color:var(--brown);line-height:1}
  .amount .l{font-weight:800;color:var(--brown);font-size:15px}
  .apick{margin-top:12px;display:flex;gap:8px;justify-content:center}
  .apick .ap{background:#fbf4e2;border:3px solid #d9c39a;border-radius:14px;padding:9px 20px;
    font-weight:900;color:var(--brown);cursor:pointer;font-size:20px}
  .apick .ap.sel{border-color:var(--gold);background:#fff3d6}
</style></head><body>
<div class="phone"><div class="wrap">
  <div class="title">Подарить шишки</div>
  <div class="friends" id="friendList"></div>
  <div class="apick"><div class="ap" data-a="10">10</div><div class="ap sel" data-a="25">25</div><div class="ap" data-a="50">50</div></div>
  <label id="anonRow" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-weight:800;color:var(--brown);cursor:pointer">
    <input type="checkbox" id="anon" style="width:20px;height:20px"> Отправить тайно (Шишка-сюрприз)
  </label>
  <button class="btn btn-lg">Отправить подарок</button>
  <h3 style="margin-top:16px">Кто тебе подарил</h3>
  <div id="giftsReceived" style="max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch"></div>
  <div id="note" style="display:none;text-align:center;font-weight:800;margin-top:10px;background:#fffaf0;border:2px solid #d9c39a;border-radius:12px;padding:9px"></div>
</div></div><script src="app.js"></script>
<script src="nav.js"></script>
</body></html>
