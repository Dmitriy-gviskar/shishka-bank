<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6fad45"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Моё дерево</title><link rel="stylesheet" href="style.css">
<style>
  .greet{margin:2px 0 4px}
  .greet img{width:90px;height:90px;
    filter:drop-shadow(0 0 0 #fff8eb) drop-shadow(0 0 2px #fff) drop-shadow(0 5px 8px rgba(60,40,15,.3))}
  .greet .bubble{font-family:"Fredoka","Nunito",sans-serif;font-size:14px}
  .hero{text-align:center;margin-top:0}
  .hero img{width:126px;height:142px;object-fit:contain;filter:drop-shadow(0 5px 6px var(--shadow))}
  .lvl{display:inline-block;font-weight:900;color:var(--ink);font-size:16px;margin-top:2px;
    background:rgba(255,248,235,.94);border:2.5px solid #fff;border-radius:14px;padding:4px 14px;
    box-shadow:0 0 0 2px #c9a86a;font-family:"Fredoka","Nunito",sans-serif}
  .progress{height:14px;background:#e4d3ad;border:2.5px solid #fff;border-radius:10px;margin:12px 40px 0;overflow:hidden;
    box-shadow:0 0 0 2px #c9a86a}
  .progress i{display:block;height:100%;width:65%;background:linear-gradient(90deg,#f1c65a,#e8a93b)}
  .passport{margin-top:12px;padding:12px 14px}
  .passport h3{text-align:center;color:var(--ink);font-weight:900;font-size:16px;margin-bottom:8px;
    font-family:"Fredoka","Nunito",sans-serif}
  .trait{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .trait .nm{width:96px;font-weight:800;color:var(--brown);font-size:13px}
  .bar{flex:1;height:13px;background:#e4d3ad;border:2px solid #c9ad7c;border-radius:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#8ec44f,#5f8e37)}
  .badges{display:flex;justify-content:space-around;margin-top:10px}
  .badge{text-align:center}
  .badge img{width:62px;height:62px;object-fit:contain}
  .badge span{display:inline-block;font-weight:800;color:var(--brown);font-size:12px;margin-top:2px;
    background:rgba(255,248,235,.94);border:2px solid #fff;border-radius:10px;padding:2px 8px;
    box-shadow:0 0 0 2px #c9a86a}
  .profile-btn{margin-top:10px}
  #pnote{display:none;text-align:center;font-weight:800;margin-top:8px;background:rgba(255,248,235,.94);
    border:2.5px solid #fff;border-radius:14px;padding:9px;color:#5f8e37;box-shadow:0 0 0 2px #c9a86a}
  .switch-user{display:inline-block;margin-top:10px;font-weight:800;font-size:13px;color:var(--brown);
    background:rgba(255,248,235,.94);border:2.5px solid #fff;border-radius:14px;padding:7px 12px;
    box-shadow:0 0 0 2px #c9a86a;text-decoration:none}
</style></head><body>
<div class="phone"><div class="wrap">
  <div class="title">Моё дерево</div>
  <div class="greet">
    <img src="assets/spirit.webp" alt="Лесной Дух">
    <div class="bubble">Смотри, как растёт твоё дерево!</div>
  </div>
  <div class="hero"><img src="assets/tree5.webp" alt=""><div class="lvl" id="levelLabel">Дубок · Уровень 5</div></div>
  <div class="progress"><i></i></div>
  <div class="card passport"><h3>Лесной паспорт</h3>
    <div class="trait"><span class="nm">Честность</span><div class="bar"><i style="width:0%" data-trait="honesty"></i></div></div>
    <div class="trait"><span class="nm">Щедрость</span><div class="bar"><i style="width:0%" data-trait="generosity"></i></div></div>
    <div class="trait"><span class="nm">Надёжность</span><div class="bar"><i style="width:0%" data-trait="reliability"></i></div></div>
    <div class="trait"><span class="nm">Мудрость</span><div class="bar"><i style="width:0%" data-trait="wisdom"></i></div></div>
  </div>
  <div class="badges" onclick="navigate('achievements.html')" style="cursor:pointer">
    <div class="badge"><img src="assets/badge1.webp" alt=""><span>Хранитель</span></div>
    <div class="badge"><img src="assets/badge2.webp" alt=""><span>Меценат</span></div>
    <div class="badge"><img src="assets/badge3.webp" alt=""><span>Спаситель</span></div>
  </div>
  <button class="btn btn-lg profile-btn">Сменить наряд</button>
  <div id="pnote"></div>
  <div style="text-align:center"><a href="#" id="switchUser" class="switch-user">Сменить пользователя</a></div>
</div></div><script src="app.js"></script>
<script src="nav.js"></script>
</body></html>
