<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7bab4c"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Котлы</title><link rel="stylesheet" href="style.css">
<style>
  .phone{background-image:url(assets/bg.webp)}
  .pot-img{text-align:center;margin-top:2px}
  .pot-img img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 6px 7px var(--shadow))}
  #potList{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:6px}
  .pcard{padding:12px 14px;margin-bottom:8px}
  .pcard .pn{font-weight:900;color:var(--ink);font-size:16px}
  .pcard .pa{color:#a1876a;font-weight:700;font-size:12px;margin-top:1px}
  .pcard .tag{float:right;background:#fff3d6;border:2px solid var(--gold);border-radius:10px;
    padding:1px 9px;font-weight:800;color:var(--brown);font-size:12px}
  .scale{height:22px;background:#e4d3ad;border:2px solid #c9ad7c;border-radius:12px;margin-top:8px;
    overflow:hidden;position:relative}
  .scale i{display:block;height:100%;background:linear-gradient(90deg,#f1c65a,#e8a93b);transition:width .4s}
  .scale span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:900;color:var(--brown);font-size:12px;text-shadow:0 1px 0 rgba(255,250,240,.6)}
  .give{margin-top:8px;display:flex;gap:6px;align-items:center}
  .give .s{background:#fff7e8;border:2px solid #d9c39a;border-radius:12px;padding:5px 13px;
    font-weight:900;color:var(--brown);cursor:pointer;font-size:15px}
  .give .s.sel{border-color:var(--gold);background:#fff3d6}
  .give .btn{margin-left:auto}
  .newp{margin-top:6px}
  .newp input,.newp select{width:100%;background:#fffaf0;border:3px solid #d9c39a;border-radius:14px;padding:9px;
    font-size:15px;font-weight:800;color:var(--ink);outline:none;box-sizing:border-box;margin-bottom:6px}
  summary{font-weight:900;color:var(--brown);cursor:pointer;text-align:center;list-style:none;
    background:rgba(255,250,240,.92);border-radius:14px;padding:6px 14px;width:fit-content;margin:0 auto}
  summary::-webkit-details-marker{display:none}
</style></head><body>
<div class="phone"><div class="wrap">
  <div class="title">Котлы желаний</div>
  <div class="pot-img"><img src="assets/pot.webp" alt="Котёл"></div>
  <div id="potList"></div>
  <details class="newp"><summary>+ Поставить свой котёл</summary>
    <input id="potTitle" placeholder="На что копим?" maxlength="40" style="margin-top:6px">
    <input id="potGoal" type="number" min="1" placeholder="Сколько шишек нужно" inputmode="numeric">
    <select id="potGuild"><option value="">Для всех друзей</option></select>
    <button class="btn btn-lg" id="createPot" style="width:100%">Поставить котёл</button>
  </details>
  <div id="note" style="display:none;text-align:center;font-weight:800;margin-top:8px;background:#fffaf0;border:2px solid #d9c39a;border-radius:12px;padding:9px"></div>
</div></div>
<script src="app.js"></script>
<script src="nav.js"></script>
</body></html>
