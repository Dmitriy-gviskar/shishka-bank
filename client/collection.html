<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6fad45"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Лесная коллекция</title><link rel="stylesheet" href="style.css">
<style>
  .phone{background:#141a10;background-image:none}
  .phone::after{display:none}
  /* атмосферный лесной фон, приглушённый под виньеткой — карты в фокусе */
  .cbg{position:absolute;inset:0;z-index:1;background:url(assets/bg_wallet_pilot.webp) center/cover;
    filter:brightness(.48) saturate(1.15)}
  .cbg::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 12%,rgba(30,44,22,.12),rgba(8,12,6,.86))}
  .cwrap{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:14px 12px 0;overflow:hidden}
  /* единый ряд чипов: ← / Коллекция / Ячеек / баланс — одна высота 42px */
  .cwrap > button[aria-label="Назад"]{
    top:14px !important;left:12px !important;z-index:6 !important;
    width:42px !important;height:42px !important;padding:0 !important;
    display:flex !important;align-items:center;justify-content:center;
    border:3px solid #fff !important;border-radius:14px !important;
    background:linear-gradient(180deg,#fff8eb,#f3e7cf) !important;
    box-shadow:0 0 0 3px #c9a86a,0 3px 0 rgba(107,79,58,.22) !important;
    font-size:20px !important;line-height:1 !important;color:#6b4f3a !important;font-weight:900 !important}
  #topbar{
    top:14px !important;right:12px !important;height:42px;box-sizing:border-box;
    border:3px solid #fff;border-radius:14px;padding:0 10px 0 6px;
    background:linear-gradient(180deg,#fff8eb,#f3e7cf);
    box-shadow:0 0 0 3px #c9a86a,0 3px 0 rgba(107,79,58,.22);
    font-size:14px;gap:4px}
  #topbar img{width:20px;height:20px}
  .chead{display:flex;align-items:center;gap:8px;margin-bottom:10px;
    padding-left:50px;padding-right:96px;min-height:42px}
  .chead .h1{box-sizing:border-box;height:42px;flex:none;display:flex;align-items:center;
    padding:0 12px;font-weight:900;color:var(--ink);font-size:16px;
    background:linear-gradient(180deg,#fff8eb,#f3e7cf);border:3px solid #fff;border-radius:14px;
    box-shadow:0 0 0 3px #c9a86a,0 3px 0 rgba(107,79,58,.22);font-family:"Fredoka","Nunito",sans-serif}
  .chead .prog,.prog{box-sizing:border-box;height:42px;flex:1;min-width:0;
    display:flex;flex-direction:column;justify-content:center;
    background:linear-gradient(180deg,#fff8eb,#f3e7cf);border:3px solid #fff;border-radius:14px;
    padding:3px 10px;font-weight:800;color:var(--brown);font-size:12px;
    box-shadow:0 0 0 3px #c9a86a,0 3px 0 rgba(107,79,58,.22);font-family:"Fredoka","Nunito",sans-serif;
    line-height:1.15}
  .prog .bar{height:5px;border-radius:5px;background:#e4d6b8;margin-top:3px;overflow:hidden;flex:none}
  .prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:5px}
  .packbtn{background:linear-gradient(180deg,#ffe9a8,#ffd062);border:3px solid #fff;border-radius:18px;
    padding:11px;font-weight:900;color:#6b4a12;font-size:17px;
    box-shadow:0 0 0 3px #e0a52e,0 4px 0 rgba(160,110,20,.3);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;
    font-family:"Fredoka","Nunito",sans-serif}
  .packbtn:active{transform:translateY(2px);box-shadow:0 0 0 3px #e0a52e,0 2px 0 rgba(160,110,20,.3)}
  /* подсказка гаранта: сколько паков до карты, которой точно нет */
  .pity{text-align:center;color:#ffe9b8;font-weight:800;font-size:11.5px;margin:-4px 0 6px;
    text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .prog .pall{font-weight:700;color:#a1876a}
  /* заголовок сезона: активный раскрыт, прошлые свёрнуты в архив */
  .season{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;padding:8px 10px;cursor:pointer;
    background:linear-gradient(135deg,rgba(60,50,34,.75),rgba(24,20,13,.8));border:2px solid rgba(255,220,150,.2);
    border-radius:14px;box-shadow:0 4px 14px -8px rgba(0,0,0,.8)}
  .season.on{border-color:rgba(255,205,90,.65);box-shadow:0 0 18px -8px rgba(255,200,70,.8)}
  .season .sn{font-weight:900;color:#ffe9b8;font-size:15px;text-shadow:0 2px 5px rgba(0,0,0,.7)}
  .season .stag{font-weight:800;font-size:10px;color:#2a1a05;background:linear-gradient(135deg,#ffe08a,#e8b64b);
    border-radius:999px;padding:2px 8px;white-space:nowrap}
  .season .stag.off{color:#cfc6ad;background:rgba(255,255,255,.12)}
  .season .sarrow{color:#e8dfc8;font-weight:900;margin-left:auto}
  .season.sp{border-color:rgba(160,220,255,.5);cursor:default}
  /* особая карта: один облик, широкая полка с поводом */
  .being.spone{display:flex;align-items:center;gap:11px;padding:9px}
  .spcell{width:54px;flex:none;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:2px solid #8fd0ff;background:#0e0e0e}
  .spcell img{width:100%;height:100%;object-fit:cover;display:block}
  .spcell.locked{border-color:#3a3a3a}
  .spcell.locked img{filter:grayscale(1) brightness(.12)}
  .spcell.locked::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;
    font-size:16px;font-weight:900;color:#ffffff44}
  .spcell{position:relative}
  .spinfo{flex:1;min-width:0}
  .spwhy{color:#bcd7e8;font-weight:700;font-size:11.5px;margin-top:2px}
  .being.spone.full .spwhy{color:#ffe08a}
  .season .cc-count{margin-left:auto}
  .season .sarrow + *{margin-left:0}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;background:rgba(255,250,240,.85);border:2px solid #d9c39a;border-radius:12px;
    padding:8px;font-weight:900;color:var(--brown);font-size:14px;cursor:pointer}
  .tabs button.on{background:#fff3d6;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  .scroll{flex:1;overflow-y:auto;padding-bottom:80px}
  /* заголовок категории — резная лесная плашка с разделителем */
  .cat{display:flex;align-items:center;gap:9px;font-weight:900;color:#ffe9b8;font-size:16px;
    margin:14px 2px 10px;text-shadow:0 2px 5px rgba(0,0,0,.7);letter-spacing:.01em}
  .cat::after{content:"";flex:1;height:2px;border-radius:2px;
    background:linear-gradient(90deg,rgba(255,205,110,.55),transparent)}
  .cat .cc-count{font-size:11.5px;font-weight:800;color:#0e1206;background:linear-gradient(135deg,#ffe08a,#e8b64b);
    border-radius:999px;padding:2px 10px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  /* полка существа: имя + 6 ячеек-грейдов (Panini), вид «страницы фолианта» */
  .being{position:relative;background:linear-gradient(160deg,rgba(60,50,34,.55),rgba(24,20,13,.7));
    border:1.5px solid rgba(255,220,150,.14);border-radius:16px;padding:9px 9px 10px;margin-bottom:10px;
    cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 18px -8px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
  .being:active{transform:scale(.99)}
  .being.full{background:linear-gradient(160deg,rgba(255,205,80,.22),rgba(120,80,20,.28));
    border-color:rgba(255,210,90,.6);box-shadow:0 8px 26px -8px rgba(0,0,0,.7),0 0 24px -8px rgba(255,200,70,.6),inset 0 1px 0 rgba(255,255,255,.12)}
  .being-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;padding:0 3px}
  .being-head .bn{font-weight:900;color:#fff;font-size:14.5px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .being.full .being-head .bn::before{content:"👑 ";font-size:12px}
  .being-head .bp{font-weight:800;color:#d7d0be;font-size:11.5px;background:rgba(0,0,0,.35);border-radius:999px;padding:2px 9px}
  /* «ещё одна карта — и эволюция»: крючок возврата прямо в списке */
  .being-head .bnear{font-weight:900;font-size:10.5px;color:#2a1a05;margin-left:auto;margin-right:7px;
    background:linear-gradient(135deg,#ffd98a,#ff9f43);border-radius:999px;padding:2px 8px;
    box-shadow:0 0 10px -3px #ff9f43;white-space:nowrap}
  .being-head .bp.done{color:#3a2600;background:linear-gradient(135deg,#ffe08a,#ffc21f);box-shadow:0 0 10px -2px #ffc21f}
  .grades6{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .gcell{position:relative;border-radius:7px;overflow:hidden;aspect-ratio:3/4;border:2px solid var(--gc);background:#0e0e0e}
  .gcell img{width:100%;height:100%;object-fit:cover;display:block}
  .gcell.locked{border-color:#3a3a3a}
  .gcell.locked img{filter:grayscale(1) brightness(.12);opacity:.85}
  .gcell.locked::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:900;color:#ffffff44}
  .gcell.g6{box-shadow:0 0 8px -1px var(--gc),inset 0 0 8px -3px var(--gc)}
  .gcell.g5{box-shadow:0 0 6px -2px var(--gc)}
  .gdup{position:absolute;top:2px;right:2px;background:var(--gc);color:#111;font-weight:900;font-size:8px;border-radius:999px;padding:0 4px;line-height:1.5}
  /* новинка в альбоме — чтобы не серфить полки после пака */
  .gnew{position:absolute;top:2px;left:2px;z-index:2;background:#ff5a4d;color:#fff;font-weight:900;font-size:8px;
    border-radius:5px;padding:1px 4px;line-height:1.35;box-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none}
  .being.has-new{border-color:rgba(255,120,90,.55);box-shadow:0 6px 18px -8px rgba(0,0,0,.7),0 0 16px -6px rgba(255,90,70,.55)}
  .being-head .bnew{font-weight:900;font-size:10px;color:#fff;margin-left:6px;margin-right:auto;
    background:#ff5a4d;border-radius:999px;padding:2px 7px;box-shadow:0 0 8px -2px #ff5a4d;white-space:nowrap}
  .newshelf{margin:0 0 10px;padding:10px 10px 8px;border-radius:16px;
    background:linear-gradient(160deg,rgba(80,36,28,.72),rgba(30,16,12,.78));
    border:2px solid rgba(255,120,90,.45);box-shadow:0 0 20px -8px rgba(255,90,70,.5)}
  .newshelf-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .newshelf-h .nt{font-weight:900;color:#ffe9b8;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.6);
    font-family:"Fredoka","Nunito",sans-serif}
  .newshelf-h .nok{margin-left:auto;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,220,150,.35);
    color:#ffe9b8;font-weight:800;font-size:11px;border-radius:999px;padding:4px 10px;cursor:pointer}
  .newshelf-h .nok:active{transform:scale(.96)}
  .newshelf-row{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .newshelf-row::-webkit-scrollbar{height:0}
  .ncard{flex:none;width:64px;cursor:pointer;text-align:center}
  .ncard .nf{width:64px;aspect-ratio:3/4;border-radius:9px;overflow:hidden;border:2.5px solid var(--gc,#ff5a4d);
    position:relative;box-shadow:0 0 10px -2px var(--gc,#ff5a4d);background:#0e0e0e}
  .ncard img{width:100%;height:100%;object-fit:cover;display:block}
  .ncard .nl{margin-top:3px;font-weight:800;color:#ffe9b8;font-size:10px;line-height:1.15;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .ncard .ng{font-weight:800;color:#ffb0a0;font-size:9px}
  /* деталь */
  .ov{position:absolute;inset:0;z-index:30;background:rgba(20,26,18,.82);display:none;
    align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
  .ov.on{display:flex}
  .sheet{background:#fffaf0;border:3px solid #d9c39a;border-radius:20px;padding:14px;max-width:320px;width:100%;
    max-height:88%;overflow-y:auto;position:relative}
  .sheet .x{position:absolute;top:8px;right:12px;background:none;border:none;font-size:26px;font-weight:900;color:var(--brown);cursor:pointer;line-height:1}
  .sheet .big{width:60%;margin:4px auto 8px;border-radius:12px;display:block;border:3px solid var(--rc,#9aa4b2);box-shadow:0 6px 18px -6px #000}
  .sheet h3{text-align:center;font-weight:900;color:var(--ink);font-size:18px}
  .sheet .sub{text-align:center;color:#a1876a;font-weight:700;font-size:12.5px;margin-bottom:8px}
  /* фраза-история грейда: карта читается как биография, а не как строка рарности */
  .sheet .lore{text-align:center;color:#7a6248;font-weight:700;font-size:12.5px;font-style:italic;
    line-height:1.45;background:#f6ecd6;border-radius:12px;padding:8px 10px;margin:-2px 2px 4px}
  /* обещание гаранта — рядом с шансами, чтобы честность была в одном месте */
  .sheet .guar{background:#eaf5da;border:2px solid #a8c98a;border-radius:12px;padding:9px 11px;margin:8px 2px;
    font-weight:700;color:#3f5a2a;font-size:12.5px;line-height:1.45;text-align:center}
  .sheet .guar b{display:block;color:#5f8e37;margin-bottom:3px}
  .grades{display:flex;flex-direction:column;gap:5px;margin:8px 0}
  .gr{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:10px;background:#f4ead2;border:2px solid #e4d6b8;cursor:pointer;transition:transform .1s}
  .gr:active{transform:scale(.98)}
  .gr.has{background:#fff;border-color:var(--gc)}
  .gr.no{opacity:.5}
  .gr.active{box-shadow:0 0 0 3px var(--gc) inset,0 0 12px -3px var(--gc);border-color:var(--gc)}
  .gr .dot{width:12px;height:12px;border-radius:50%;background:var(--gc);flex:none;box-shadow:0 0 6px -1px var(--gc)}
  .gr .gn{flex:1;font-weight:800;color:var(--ink);font-size:13px}
  .gr .gq{font-weight:900;color:var(--brown);font-size:12px}
  .acts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .acts button{border:none;border-radius:12px;padding:10px;font-weight:900;font-size:14px;cursor:pointer}
  .a-merge{background:#8a6fd0;color:#fff} .a-sell{background:#e0a52e;color:#3a2600} .a-list{background:var(--green);color:#fff}
  .acts button:disabled{opacity:.4;cursor:default}
  .note2{text-align:center;font-weight:800;font-size:12.5px;margin-top:6px;min-height:16px}
  /* открытие пака */
  .pov{position:absolute;inset:0;z-index:40;background:rgba(12,16,10,.92);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
  .pov.on{display:flex}
  .pcards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:340px}
  .pcard{width:76px;aspect-ratio:3/4;border-radius:10px;border:3px solid var(--rc,#9aa4b2);overflow:hidden;position:relative;
    transform:rotateY(90deg) scale(.8);opacity:0;box-shadow:0 0 22px -4px var(--rc)}
  .pcard.show{animation:flip .5s ease forwards}
  .pcard img{width:100%;height:100%;object-fit:cover}
  .pcard .new{position:absolute;top:4px;left:4px;background:#ff5a4d;color:#fff;font-weight:900;font-size:9px;border-radius:6px;padding:1px 5px}
  @keyframes flip{to{transform:rotateY(0) scale(1);opacity:1}}
  .pov h2{color:#fff;font-weight:900;font-size:22px;text-shadow:0 2px 6px #000}
  .pov .done{background:var(--green);border:3px solid var(--green-d);color:#fff;font-weight:900;font-size:17px;padding:11px 30px;border-radius:16px;box-shadow:0 4px 0 var(--green-d);cursor:pointer}
  @media(prefers-reduced-motion:reduce){.pcard.show{animation-duration:.05s}}
  /* коробка-пак: руби тапом */
  .crate{display:flex;flex-direction:column;align-items:center;gap:14px}
  .crate-box{width:190px;height:190px;object-fit:contain;cursor:pointer;user-select:none;
    filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));animation:crateIdle 1.6s ease-in-out infinite}
  .crate-box:active{transform:scale(.94)}
  .crate-box.hit{animation:crateHit .16s ease}
  .crate-box.crack{animation:crateCrack .5s ease forwards}
  .crate-hint{color:#ffe9a8;font-weight:900;font-size:15px;text-shadow:0 2px 4px rgba(0,0,0,.6);animation:pulseHint 1.2s ease-in-out infinite}
  @keyframes crateIdle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
  @keyframes crateHit{0%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-4deg)}100%{transform:scale(1)}}
  @keyframes crateCrack{0%{transform:scale(1);opacity:1}40%{transform:scale(1.3) rotate(6deg);opacity:1}100%{transform:scale(2.2) rotate(-10deg);opacity:0}}
  @keyframes pulseHint{0%,100%{opacity:.7}50%{opacity:1}}
  /* щепки и шишки-дождь при рубке */
  .chips{position:absolute;inset:0;pointer-events:none;z-index:45;overflow:hidden}
  .chips span{position:absolute;left:50%;top:44%;font-size:26px;will-change:transform,opacity}
  .chips span.fly{animation:chipFly .9s cubic-bezier(.2,.6,.3,1) forwards}
  @keyframes chipFly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--dr));opacity:0}}
  /* JACKPOT walkout — легендарка/золото */
  .jackpot{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.55),rgba(0,0,0,.94))}
  .jackpot.on{display:flex}
  .jp-rays{position:absolute;width:200vmax;height:200vmax;left:50%;top:45%;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,var(--jc,#ffc21f) 0deg 6deg,transparent 6deg 12deg);
    opacity:.5;animation:jpSpin 9s linear infinite;mix-blend-mode:screen}
  @keyframes jpSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .jp-card{position:relative;z-index:2;width:210px;aspect-ratio:3/4;border-radius:16px;overflow:hidden;
    border:4px solid var(--jc,#ffc21f);box-shadow:0 0 60px 6px var(--jc),0 0 120px 12px var(--jc);
    transform:scale(.2) rotate(-8deg);opacity:0;animation:jpIn .7s cubic-bezier(.2,1.4,.4,1) forwards}
  .jp-card img{width:100%;height:100%;object-fit:cover}
  @keyframes jpIn{60%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
  .jp-label{position:absolute;z-index:3;bottom:24%;left:0;right:0;text-align:center;
    font-weight:900;font-size:30px;letter-spacing:.04em;color:#fff;text-transform:uppercase;
    text-shadow:0 0 18px var(--jc),0 3px 8px rgba(0,0,0,.7);opacity:0;animation:jpLabel .5s ease .4s forwards}
  @keyframes jpLabel{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
  .jp-tap{position:absolute;bottom:60px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:13px;opacity:.8;z-index:3;animation:pulseHint 1.2s ease-in-out infinite}
  .jp-parts{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .jp-parts span{position:absolute;left:50%;top:45%;font-size:24px;animation:chipFly 1.1s ease-out forwards}
  .shake{animation:shake .5s ease}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(5px,3px)}}
  /* ═══ Ритуал эволюции: три карты сливаются в одну грейдом выше ═══ */
  .evo{position:absolute;inset:0;z-index:65;display:none;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 46%,rgba(0,0,0,.6),rgba(0,0,0,.96))}
  .evo.on{display:flex}
  .evo-rays{position:absolute;width:200vmax;height:200vmax;left:50%;top:46%;
    background:repeating-conic-gradient(from 0deg,var(--ec,#ffc21f) 0deg 5deg,transparent 5deg 11deg);
    opacity:0;mix-blend-mode:screen;transform:translate(-50%,-50%);
    animation:jpSpin 9s linear infinite,evoRaysIn .9s ease .95s forwards}
  @keyframes evoRaysIn{to{opacity:.42}}
  .evo-stage{position:relative;z-index:2;width:200px;aspect-ratio:3/4}
  /* три исходные карты слетаются к центру и растворяются во вспышке */
  .evo-src{position:absolute;left:50%;top:50%;width:104px;aspect-ratio:3/4;margin:-69px 0 0 -52px;
    border-radius:10px;object-fit:cover;border:3px solid var(--ec0,#9aa4b2);
    box-shadow:0 0 20px -6px var(--ec0,#9aa4b2);will-change:transform,opacity;
