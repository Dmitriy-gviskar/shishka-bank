<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7bab4c"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Магазин впечатлений</title><link rel="stylesheet" href="style.css">
<style>
  .phone{background-image:url(assets/bg.webp)}
  .wrap{overflow-y:hidden;padding-top:12px}
  .title{font-size:18px;padding:6px 16px;margin-bottom:6px;white-space:nowrap}
  #shopList{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 2px 6px}
  .lot{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px}
  .lot .nm{flex:1;min-width:0;font-weight:900;color:var(--ink);font-size:15px;line-height:1.2}
  .lot .right{text-align:center;flex:none}
  .lot .price{font-size:20px}
  .lot .btn{margin-top:4px}
</style></head><body>
<div class="phone"><div class="wrap">
  <div class="title">Магазин впечатлений</div>
  <div id="shopList"></div>
<div id="note" style="display:none;text-align:center;color:#b3452e;font-weight:800;margin-top:8px;background:#fff3ee;border:2px solid #e0a99a;border-radius:12px;padding:8px"></div>
</div></div><script src="app.js"></script>
<script src="nav.js"></script>
</body></html>
