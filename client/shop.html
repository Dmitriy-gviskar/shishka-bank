<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7bab4c"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Магазин впечатлений</title><link rel="stylesheet" href="style.css">
<style>
  .phone{background-image:url(assets/bg.webp)}

  .lot .price{font-size:22px}
  .lot .btn{margin-top:6px}
</style></head><body>
<div class="phone"><div class="wrap">
  <div class="title">Магазин впечатлений</div>
  <div id="shopList"></div>
<div id="note" style="display:none;text-align:center;color:#b3452e;font-weight:800;margin-top:8px;background:#fff3ee;border:2px solid #e0a99a;border-radius:12px;padding:8px"></div>
</div></div><script src="app.js"></script>
<script src="nav.js"></script>
</body></html>
