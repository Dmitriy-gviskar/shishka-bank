<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2d4a1a"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Шишка Банк</title>
<style>
  :root{
    --cream:#f6eede; --card:#efe4cc; --ink:#5b4636; --brown:#6b4f3a;
    --green:#7bab4c; --green-d:#5f8e37; --gold:#e8b64b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#1a2418;display:flex;justify-content:center;min-height:100vh;
    font-family:"Nunito","Baloo 2","SF Pro Rounded",system-ui,Arial,sans-serif}
  .phone{position:relative;width:min(390px,100vw);height:100vh;height:100dvh;max-height:844px;overflow:hidden;
    background:#1a2418}
  .wrap{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
    overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}

  /* Hero */
  #hero{position:relative;height:220px;overflow:hidden;flex:none}
  #hero img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
  #hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(0deg,rgba(26,36,24,1) 0%,rgba(26,36,24,.7) 30%,rgba(26,36,24,.15) 70%,rgba(26,36,24,0) 100%)}
  #hero .greet{position:absolute;bottom:16px;left:16px;z-index:3;color:#fff;font-weight:900;font-size:22px;text-shadow:0 2px 4px rgba(0,0,0,.4)}

  /* Balance card */
  .balCard{margin:-30px 14px 0;position:relative;z-index:5;
    background:linear-gradient(135deg,#4a7a2e,#5f8e37);border-radius:20px;
    padding:20px;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .balCard .label{font-size:12px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.5px}
  .balCard .amount{font-size:44px;font-weight:900;line-height:1;margin:4px 0;letter-spacing:-1px}
  .balCard .amount span{font-size:20px;font-weight:700;opacity:.7;margin-left:4px}
  .balCard .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .balCard .tree{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;opacity:.85}
  .balCard .tree img{width:28px;height:28px;object-fit:contain}

  /* Quick actions */
  .actions{display:flex;gap:0;margin:0 10px;padding:12px 0}
  .actions button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    background:none;border:none;color:#c4d8b0;font-size:11px;font-weight:800;cursor:pointer;padding:8px 4px}
  .actions button .icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:rgba(255,255,255,.08)}
  .actions button:active .icon{background:rgba(255,255,255,.16)}

  /* Activity header */
  .sect{display:flex;justify-content:space-between;align-items:center;margin:0 14px 8px}
  .sect .t{color:#8caa70;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  .sect .more{color:#5f8e37;font-size:12px;font-weight:700;cursor:pointer}

  /* Activity list */
  #activity{margin:0 10px}
  .tx{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:4px;
    background:rgba(255,255,255,.04);border-radius:14px;cursor:pointer}
  .tx .txIcon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:18px;flex:none}
  .tx .txInfo{flex:1;min-width:0}
  .tx .txWho{font-weight:800;color:#ddd;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx .txType{font-size:11px;color:#8a9a7a;margin-top:1px}
  .tx .txAmt{font-weight:800;font-size:15px;flex:none}
  .tx .txAmt.plus{color:#7bab4c}.tx .txAmt.minus{color:#d4934a}

  /* Daily gift banner */
  .daily{margin:12px 14px;background:linear-gradient(135deg,#4a3a1a,#6b4a12);border-radius:16px;
    padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
  .daily .fire{font-size:32px}
  .daily .txt{flex:1}
  .daily .t1{font-weight:900;color:#ffd98a;font-size:15px}
  .daily .t2{font-weight:700;color:#b8985a;font-size:12px;margin-top:2px}
  .daily .claim{background:var(--gold);color:#5b3a10;border:none;border-radius:12px;
    padding:8px 16px;font-weight:900;font-size:14px;cursor:pointer}
  .daily.claimed{opacity:.5}

  /* Links */
  .links{display:flex;gap:8px;margin:4px 14px 0;flex-wrap:wrap}
  .links a{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 14px;
    color:#8caa70;font-weight:700;font-size:12px;text-decoration:none}

  /* Empty activity */
  .noTx{text-align:center;color:#5a7048;font-weight:700;font-size:13px;padding:16px}
</style>
</head>
<body>
<div class="phone">
  <div class="wrap">
    <!-- Hero -->
    <div id="hero">
      <img src="assets/hero_bank.webp" alt="Шишка Банк">
      <div class="greet">Шишка Банк</div>
    </div>

    <!-- Balance -->
    <div class="balCard">
      <div class="label">Кошелёк</div>
      <div class="amount" id="bal">…<span>шишек</span></div>
      <div class="row">
        <div class="tree"><img src="assets/tree.webp" alt=""> <span id="treeInfo">Дубок · Ур.1</span></div>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="actions">
      <button onclick="navigate('mail.html')"><div class="icon">💬</div>Чат</button>
      <button onclick="navigate('transfers.html')"><div class="icon">💸</div>Отправить</button>
      <button id="scanBtn"><div class="icon">📷</div>QR-оплата</button>
      <button onclick="navigate('shop.html')"><div class="icon">🛒</div>Магазин</button>
    </div>

    <!-- Daily gift -->
    <div class="daily" id="daily" style="display:none">
      <div class="fire" id="dailyFire">🎁</div>
      <div class="txt"><div class="t1" id="dailyT1">Ежедневный подарок</div><div class="t2" id="dailyT2">Заходи каждый день</div></div>
      <button class="claim" id="dailyBtn">Забрать</button>
    </div>

    <!-- Recent activity -->
    <div class="sect"><span class="t">Последние операции</span></div>
    <div id="activity"><div class="noTx">Пока нет операций</div></div>

    <!-- Links -->
    <div class="links">
      <a href="quests.html">📋 Задания</a>
      <a href="market.html">🏪 Лавки</a>
      <a href="collection.html">🃏 Коллекция</a>
      <a href="album.html">📖 Альбом</a>
      <a href="news.html">📰 Новости</a>
    </div>
  </div>
</div>

<!-- QR scanner overlay -->
<div id="scanBox" style="display:none;position:absolute;inset:0;z-index:20;background:#1d241a">
  <video id="scanVideo" playsinline style="width:100%;height:100%;object-fit:cover"></video>
  <div style="position:absolute;top:16px;left:0;right:0;text-align:center;pointer-events:none">
    <span style="font-weight:900;color:#fff;background:rgba(0,0,0,.5);padding:8px 16px;border-radius:12px">Наведи на QR продавца</span></div>
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
    <div style="width:200px;height:200px;border:4px solid #f1c65a;border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)"></div></div>
  <button id="scanClose" style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:#fffaf0;border:3px solid #d9c39a;border-radius:16px;padding:11px 30px;font-size:16px;font-weight:900;color:var(--brown)">Отмена</button>
</div>

<script src="assets/qrcode.js"></script>
<script src="assets/jsqr.js"></script>
<script src="app.js"></script>
<script src="nav.js"></script>
</body>
</html>
