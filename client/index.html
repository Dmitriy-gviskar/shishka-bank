<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7bab4c"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Шишка Банк — Кошелёк</title>
<style>
  :root{
    --cream:#f6eede; --card:#efe4cc; --ink:#5b4636; --brown:#6b4f3a;
    --green:#7bab4c; --green-d:#5f8e37; --gold:#e8b64b; --shadow:rgba(80,55,30,.25);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#2c3327;display:flex;justify-content:center;min-height:100vh;
    font-family:"Nunito","Baloo 2","SF Pro Rounded",system-ui,Arial,sans-serif}
  .phone{position:relative;width:min(390px,100vw);height:100vh;height:100dvh;max-height:844px;overflow:hidden;
    background:url(assets/bg.webp) center/cover no-repeat}
  .phone::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,250,235,.10),rgba(60,80,45,.20))}
  .wrap{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
    padding:20px 16px 0;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* Приветствие */
  .greet{margin-top:6px}
  .greet .hi{font-size:28px;font-weight:900;color:var(--brown);line-height:1.1}
  .greet .hi em{font-style:normal;color:var(--green)}
  .greet .tree{display:flex;align-items:center;gap:8px;margin-top:6px}
  .greet .tree img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 3px 4px var(--shadow))}
  .greet .tree .lvl{font-weight:800;color:var(--brown);font-size:14px;line-height:1.3}
  .greet .tree .lvl span{display:block;color:var(--green-d);font-size:12px}

  /* Карточка кошелька */
  .card{margin-top:18px;background:var(--card);border:4px solid var(--brown);
    border-radius:26px;box-shadow:0 8px 0 rgba(107,79,58,.30);padding:20px}
  .card .lbl{font-size:13px;font-weight:800;color:#a1876a;text-transform:uppercase;letter-spacing:.5px}
  .card .amount{font-size:56px;font-weight:900;color:var(--brown);line-height:1;margin:6px 0}
  .card .sub{font-size:14px;font-weight:700;color:#a1876a}

  /* Кнопка */
  .btn{display:block;margin:16px auto 0;background:var(--green);border:3px solid var(--green-d);
    color:#fff;font-size:18px;font-weight:900;padding:14px 40px;border-radius:18px;
    box-shadow:0 5px 0 var(--green-d);cursor:pointer;width:100%;max-width:280px}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}

  /* Навигация */
  .nav{position:sticky;bottom:0;z-index:5;margin-top:auto;flex:0 0 auto;
    display:flex;justify-content:space-around;align-items:center;
    background:rgba(246,238,222,.985);border-top:3px solid #d9c39a;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(2px)}
  .nav button{background:none;border:none;padding:6px;border-radius:16px;cursor:pointer}
  .nav img{width:44px;height:44px;object-fit:contain;display:block}
  .nav .active{background:#fff3d6;box-shadow:0 0 0 3px var(--gold) inset}

  /* Ежедневный подарок */
  .daily{margin-top:12px;background:linear-gradient(135deg,#ffe9a8,#ffd062);
    border:3px solid #e0a52e;border-radius:20px;padding:12px 14px;
    box-shadow:0 5px 0 rgba(160,110,20,.30);display:flex;align-items:center;gap:12px}
  .daily .fire{font-size:34px;line-height:1;filter:drop-shadow(0 2px 2px rgba(160,90,20,.4))}
  .daily .txt{flex:1;text-align:left}
  .daily .t1{font-weight:900;color:#6b4a12;font-size:16px;line-height:1.1}
  .daily .t2{font-weight:800;color:#9a7420;font-size:12.5px;margin-top:2px}
  .daily button{background:var(--green);border:3px solid var(--green-d);color:#fff;
    font-size:16px;font-weight:900;padding:10px 18px;border-radius:16px;
    box-shadow:0 4px 0 var(--green-d);cursor:pointer;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.15)}
  .daily button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}
  .daily.got{background:#eef3e6;border-color:#cdd9b8;box-shadow:0 5px 0 rgba(120,140,90,.2)}
  .daily.got .t1{color:#5f7a38}

  /* Дождь шишек */
  .rain{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden}
  .rain span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(900px) rotate(360deg);opacity:.2}}
  @media(prefers-reduced-motion:reduce){.rain span{animation-duration:.1s!important}}

  .links{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .links a{font-weight:800;font-size:12px;color:var(--brown);background:rgba(255,250,240,.85);border:2px solid #d9c39a;border-radius:14px;padding:6px 12px;text-decoration:none}
</style>
</head>
<body>
  <div class="phone">
    <div class="wrap">
      <div class="greet">
        <div class="hi">С возвращением,<br><em id="greetName">…</em>!</div>
        <div class="tree">
          <img id="treeImg" src="assets/tree.webp" alt="Дерево">
          <div class="lvl" id="treeLvl">Уровень 1<span>Дубок</span></div>
        </div>
      </div>

      <div class="daily" id="daily" style="display:none">
        <div class="fire" id="dailyFire">🎁</div>
        <div class="txt"><div class="t1" id="dailyT1">Ежедневный подарок</div>
          <div class="t2" id="dailyT2">Заходи каждый день — серия растёт</div></div>
        <button id="dailyBtn">Забрать</button>
      </div>

      <div class="card">
        <div class="lbl">Кошелёк</div>
        <div class="amount" id="bal">…</div>
        <div class="sub">Всего накоплено</div>
      </div>

      <button class="btn" onclick="navigate('quests.html')">Пополнить</button>

      <div class="links">
        <a href="transfers.html">💸 Подарки</a>
        <a href="shop.html">🛒 Магазин</a>
        <a href="mail.html">💬 Чат</a>
        <a href="collection.html">🃏 Коллекция</a>
        <a href="forest.html">🌲 Поляна</a>
      </div>
    </div>

    <!-- QR scanner -->
    <div id="scanBox" style="display:none;position:absolute;inset:0;z-index:20;background:#1d241a">
      <video id="scanVideo" playsinline style="width:100%;height:100%;object-fit:cover"></video>
      <div style="position:absolute;top:16px;left:0;right:0;text-align:center;pointer-events:none">
        <span class="on-art" style="font-weight:900;color:var(--ink)">Наведи на QR продавца</span></div>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
        <div style="width:200px;height:200px;border:4px solid #f1c65a;border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)"></div></div>
      <button id="scanClose" style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:#fffaf0;border:3px solid #d9c39a;border-radius:16px;padding:11px 30px;font-size:16px;font-weight:900;color:var(--brown)">Отмена</button>
    </div>
  </div>
<script src="assets/qrcode.js"></script>
<script src="assets/jsqr.js"></script>
<script src="app.js"></script>
<script src="nav.js"></script>
</body>
</html>
