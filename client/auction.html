<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6fad45"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Лесной аукцион</title><link rel="stylesheet" href="style.css">
<style>
  /* bg: global cozy */
  .lot-img{text-align:center;margin-top:4px}
  .lot-img img{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 6px 7px var(--shadow))}
  .lot-name{text-align:center;font-weight:900;color:var(--ink);font-size:20px;font-family:"Fredoka","Nunito",sans-serif}
  .bid{margin-top:8px;padding:14px;text-align:center}
  .bid .cur{font-size:36px;font-weight:900;color:var(--brown)}
  .bid .lead{color:#a1876a;font-weight:700;margin-top:2px}
  .bids{display:flex;gap:8px;justify-content:center;margin-top:14px}
  .bids .s{padding:8px 16px;font-size:18px;font-family:"Fredoka","Nunito",sans-serif}
  .timer{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;
    font-weight:900;color:var(--brown);font-size:16px;background:rgba(255,248,235,.94);
    border:2.5px solid #fff;border-radius:14px;padding:8px 12px;box-shadow:0 0 0 2px #c9a86a}
  .timer.soon{box-shadow:0 0 0 2px #e0864b;color:#c0562a}
  .timer b{font-size:19px}
  .winner{text-align:center;margin-top:16px;background:#fff3d6;border:3px solid var(--gold);
    border-radius:18px;padding:18px 14px;font-weight:900;color:var(--ink)}
  .winner .cup{font-size:40px}
  .winner .who{font-size:22px;color:var(--brown);margin-top:4px}
  .winner .sub{font-weight:700;color:#a1876a;font-size:14px;margin-top:6px}
</style></head><body>
<div class="phone"><div class="wrap">
  <div class="title">Лесной аукцион</div>
  <div class="lot-img"><img src="assets/auction.webp"></div>
  <div class="lot-name" id="lotName">…</div>
  <div id="liveBox">
    <div class="card bid"><div class="cur" id="curBid">—</div><div class="lead" id="lead"></div></div>
    <div class="timer" id="timer" style="display:none">До конца: <b id="timerVal">…</b></div>
    <div class="bids"><div class="s sel" data-a="5">+5</div><div class="s" data-a="10">+10</div><div class="s" data-a="25">+25</div></div>
    <div style="text-align:center;margin-top:8px"><input id="bidCustom" type="number" min="1" placeholder="или своя ставка" inputmode="numeric"
      style="width:65%;background:#fffaf0;border:3px solid #d9c39a;border-radius:14px;padding:9px;font-size:16px;font-weight:800;color:var(--ink);text-align:center;outline:none"></div>
    <button class="btn btn-lg" id="doBid">Сделать ставку</button>
    <div id="note" class="page-note"></div>
  </div>
  <div class="winner" id="winnerBox" style="display:none"></div>
</div></div>
<script src="app.js"></script>
<script src="nav.js"></script>
</body></html>
