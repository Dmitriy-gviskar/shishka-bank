<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7bab4c"><link rel="apple-touch-icon" href="assets/app-icon-192.png">
<title>Лесные гильдии</title><link rel="stylesheet" href="style.css">
<style>
  .phone{background-image:url(assets/bg.webp)}
  .glist{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
  .gcard{padding:12px 14px;margin-bottom:8px}
  .gcard .gn{font-weight:900;color:var(--ink);font-size:17px}
  .gcard .gm{color:#a1876a;font-weight:700;font-size:13px;margin-top:2px}
  .gcard .row{display:flex;align-items:center;gap:8px;margin-top:6px}
  .mrow{display:flex;align-items:center;padding:8px 12px;margin-top:6px}
  .mrow .nm{font-weight:800;color:var(--ink)}
  .mrow .share{margin-left:auto;background:#fff3d6;border:2px solid var(--gold);border-radius:10px;
    padding:2px 10px;font-weight:800;color:var(--brown);font-size:13px}
  #chat{flex:1 1 auto;min-height:80px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
  .msg{background:#fffaf0;border:2px solid #d9c39a;border-radius:14px;padding:7px 11px;margin-bottom:6px;max-width:85%;width:fit-content}
  .msg .who{font-weight:900;color:var(--green-d);font-size:12px}
  .msg .txt{font-weight:700;color:var(--ink);font-size:14px}
  .msg.bank{border-color:var(--gold);background:#fff3d6;margin-left:auto}
  .phrases{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0 6px}
  .phrases button{background:#fff7e8;border:3px solid #d9c39a;border-radius:14px;padding:6px 11px;
    font-weight:800;color:var(--brown);cursor:pointer;font-size:13px}
  .newg{margin-top:8px}
  .newg input{width:100%;background:#fffaf0;border:3px solid #d9c39a;border-radius:14px;padding:10px;
    font-size:16px;font-weight:800;color:var(--ink);outline:none;box-sizing:border-box}
  h3{text-align:center;color:var(--ink);font-weight:900;margin:12px 0 4px;font-size:16px;
    background:rgba(255,250,240,.92);border-radius:14px;padding:5px 14px;align-self:center;
    margin-left:auto;margin-right:auto;width:fit-content}
</style></head><body>
<div class="phone"><div class="wrap">
  <div class="title">Лесные гильдии</div>

  <div id="listView" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="glist" id="glist"></div>
    <div class="newg">
      <input id="gName" placeholder="Название новой гильдии" maxlength="24">
      <button class="btn btn-lg" id="createG" style="width:100%;margin-top:6px">Основать гильдию</button>
    </div>
  </div>

  <div id="guildView" style="display:none;flex-direction:column;flex:1;min-height:0">
    <h3 id="gTitle">…</h3>
    <div id="gMembers"></div>
    <h3>Гильдейский костёр</h3>
    <div id="chat"></div>
    <div class="phrases" id="phrases"></div>
    <h3>Летопись</h3>
    <div id="history" style="max-height:160px;overflow-y:auto;-webkit-overflow-scrolling:touch"></div>
    <button class="btn btn-sm" id="backToList" style="align-self:center;background:#fff3d6;color:var(--brown);box-shadow:0 4px 0 #d9c39a">К списку гильдий</button>
  </div>

  <div id="note" style="display:none;text-align:center;font-weight:800;margin:8px 0;background:#fffaf0;border:2px solid #d9c39a;border-radius:12px;padding:9px"></div>
</div></div>
<script src="app.js"></script>
<script src="guilds.js"></script>
<script src="nav.js"></script>
</body></html>
