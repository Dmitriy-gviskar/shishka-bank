<!doctype html><html lang="ru"><head><meta charset="utf-8">
<title>Шишка-Банк — 5 новых героев</title>
<style>
 body{margin:0;background:#0f1015;color:#e8e4dc;font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:28px}
 h1{font-weight:800;font-size:22px;margin:0 0 4px}
 .sub{color:#8a8578;font-size:13px;margin-bottom:26px}
 .being{margin-bottom:34px}
 .bh{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
 .bn{font-size:18px;font-weight:800}
 .bw{color:#9a9488;font-size:13px}
 .row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
 .card{background:#181920;border-radius:12px;overflow:hidden;border:2px solid var(--c);box-shadow:0 6px 20px -8px #000,0 0 14px -6px var(--c)}
 .card img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}
 .cap{padding:6px 8px;font-size:11px;font-weight:700;color:var(--c);text-align:center}
 @media(max-width:900px){.row{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<h1>Лесная коллекция — 5 новых героев</h1>
<div class="sub">слева направо: Обычная → Золотая · цвет по грейдам + развитие персонажа (новичок→божество) + свой мир у каждого</div>
<div id="app"></div>
<script>
 const beings=[
  ['shchuka','Щука','речной фехтовальщик'],
  ['udod','Удод','королевский герольд'],
  ['ivolga','Иволга','оперная дива'],
  ['tushkanchik','Тушканчик','гонщик пустыни'],
  ['kvaksha','Квакша','дождевой садовник']];
 const grades=[['1_common','Обычная','#9aa4b2'],['2_uncommon','Необычная','#46c93a'],['3_rare','Редкая','#3b8eea'],['4_epic','Эпическая','#a24bf0'],['5_legendary','Легендарная','#ff8a2b'],['6_gold','Золотая','#ffc21f']];
 document.getElementById('app').innerHTML=beings.map(([c,n,w])=>
  `<div class="being"><div class="bh"><span class="bn">${n}</span><span class="bw">${w}</span></div>
   <div class="row">${grades.map(([g,gn,col])=>
     `<div class="card" style="--c:${col}"><img src="${c}_${g}.png" alt="${n} ${gn}"><div class="cap">${gn}</div></div>`).join('')}</div></div>`).join('');
</script></body></html>
