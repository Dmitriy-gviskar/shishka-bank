<meta charset="utf-8"><title>Ритуал эволюции — демо</title>
<!-- Демо A1: те же стили и таймлайн, что в client/collection.html + app.js. Ассеты берутся из клиента. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1c2118;display:flex;justify-content:center;min-height:100vh;font-family:"Nunito",system-ui,sans-serif}
.phone{position:relative;width:390px;height:800px;overflow:hidden;background:#141a10;
  background-image:radial-gradient(120% 80% at 50% 12%,#26301c,#0b0f07)}
.panel{position:absolute;inset:auto 0 0 0;padding:18px;display:flex;flex-direction:column;gap:9px;z-index:10}
.panel button{border:none;border-radius:13px;padding:12px;font-weight:900;font-size:15px;cursor:pointer;
  background:#8a6fd0;color:#fff}
.panel button.b2{background:#e0a52e;color:#3a2600}
.panel button.b3{background:#5f8e37;color:#fff}
.hint{color:#cfc6ad;font-weight:800;font-size:12.5px;text-align:center;padding:0 18px}
.head{position:absolute;top:18px;left:0;right:0;text-align:center;color:#ffe9b8;font-weight:900;font-size:17px}
/* ═══ Ритуал эволюции (1-в-1 из collection.html) ═══ */
.evo{position:absolute;inset:0;z-index:65;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 46%,rgba(0,0,0,.6),rgba(0,0,0,.96))}
.evo.on{display:flex}
.evo-rays{position:absolute;width:200vmax;height:200vmax;left:50%;top:46%;
  background:repeating-conic-gradient(from 0deg,var(--ec,#ffc21f) 0deg 5deg,transparent 5deg 11deg);
  opacity:0;mix-blend-mode:screen;transform:translate(-50%,-50%);
  animation:jpSpin 9s linear infinite,evoRaysIn .9s ease .95s forwards}
@keyframes jpSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes evoRaysIn{to{opacity:.42}}
.evo-stage{position:relative;z-index:2;width:200px;aspect-ratio:3/4}
.evo-src{position:absolute;left:50%;top:50%;width:104px;aspect-ratio:3/4;margin:-69px 0 0 -52px;
  border-radius:10px;object-fit:cover;border:3px solid var(--ec0,#9aa4b2);
  box-shadow:0 0 20px -6px var(--ec0,#9aa4b2);will-change:transform,opacity;
  animation:evoMerge .95s cubic-bezier(.55,-.2,.4,1) forwards}
.evo-src.s1{--tx:-92px;--ty:-26px;--rot:-17deg}
.evo-src.s2{--tx:0px;--ty:38px;--rot:5deg;animation-delay:.06s}
.evo-src.s3{--tx:92px;--ty:-26px;--rot:17deg;animation-delay:.12s}
@keyframes evoMerge{
  0%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(1);opacity:1}
  55%{transform:translate(calc(var(--tx)*.45),calc(var(--ty)*.45)) rotate(0) scale(.88);opacity:1;filter:brightness(1.5)}
  100%{transform:translate(0,0) rotate(0) scale(.28);opacity:0;filter:brightness(3.2)}}
.evo-flash{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,var(--ec,#ffc21f) 45%,transparent 72%);opacity:0;z-index:3;
  animation:evoFlash .6s ease .84s forwards}
@keyframes evoFlash{0%{transform:scale(.4);opacity:0}35%{transform:scale(9);opacity:1}100%{transform:scale(17);opacity:0}}
.evo-new{position:absolute;left:50%;top:50%;width:200px;aspect-ratio:3/4;margin:-133px 0 0 -100px;
  border-radius:16px;overflow:hidden;z-index:4;border:4px solid var(--ec,#ffc21f);
  box-shadow:0 0 60px 4px var(--ec),0 0 120px 10px var(--ec);opacity:0;
  animation:evoNew .85s cubic-bezier(.2,1.4,.4,1) 1s forwards}
.evo-new img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes evoNew{0%{transform:scale(.2) rotate(-7deg);opacity:0}
  60%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.evo-label{position:absolute;z-index:5;bottom:21%;left:0;right:0;text-align:center;color:#ffe9b8;
  font-weight:800;font-size:16px;text-shadow:0 2px 8px rgba(0,0,0,.8);opacity:0;
  animation:jpLabel .5s ease 1.45s forwards}
@keyframes jpLabel{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.evo-label b{display:block;font-size:29px;font-weight:900;color:#fff;text-transform:uppercase;
  letter-spacing:.04em;text-shadow:0 0 18px var(--ec),0 3px 8px rgba(0,0,0,.7)}
.evo-parts{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.evo-parts span{position:absolute;left:50%;top:50%;font-size:24px;animation:chipFly 1.1s ease-out forwards}
@keyframes chipFly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--dr));opacity:0}}
.jp-tap{position:absolute;bottom:60px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:13px;opacity:.8;z-index:6}
.evo .jp-tap{opacity:0;animation:jpLabel .4s ease 1.7s forwards,pulseHint 1.2s ease-in-out 2.1s infinite}
@keyframes pulseHint{0%,100%{opacity:.7}50%{opacity:1}}
.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(5px,3px)}}
</style>
<div class="phone">
  <div class="head">Ритуал эволюции</div>
  <div class="panel">
    <div class="hint">Три одинаковые карты сливаются в одну грейдом выше</div>
    <button onclick="run('burunduk','Бурундук',2,3)">Бурундук: Необычная → Редкая</button>
    <button class="b2" onclick="run('ezh','Ёж',3,4)">Ёж: Редкая → Эпическая</button>
    <button class="b3" onclick="run('burunduk','Бурундук',5,6)">Бурундук: Легендарная → Золотая</button>
  </div>

  <div class="evo" id="evo">
    <div class="evo-rays"></div>
    <div class="evo-parts" id="evoParts"></div>
    <div class="evo-stage">
      <img class="evo-src s1" id="evoS1" alt=""><img class="evo-src s2" id="evoS2" alt=""><img class="evo-src s3" id="evoS3" alt="">
      <div class="evo-flash"></div>
      <div class="evo-new"><img id="evoNewImg" alt=""></div>
    </div>
    <div class="evo-label" id="evoLabel"></div>
    <div class="jp-tap">нажми, чтобы продолжить</div>
  </div>
</div>
<script>
const RAR = {1:{name:'Обычная',color:'#9aa4b2'},2:{name:'Необычная',color:'#46c93a'},3:{name:'Редкая',color:'#3b8eea'},
  4:{name:'Эпическая',color:'#a24bf0'},5:{name:'Легендарная',color:'#ff8a2b'},6:{name:'Золотая',color:'#ffc21f'}};
const asset = (code, grade) => `../client/assets/cards/${code}_${grade}.webp`;

function evolveRitual(c, fromGrade, toGrade) {
  return new Promise((resolve) => {
    const ov = document.getElementById('evo');
    const rTo = RAR[toGrade] || {}, rFrom = RAR[fromGrade] || {};
    ov.style.setProperty('--ec', rTo.color || '#ffc21f');
    ov.style.setProperty('--ec0', rFrom.color || '#9aa4b2');
    ['evoS1','evoS2','evoS3'].forEach((id) => document.getElementById(id).src = asset(c.code, fromGrade));
    document.getElementById('evoNewImg').src = asset(c.code, toGrade);
    document.getElementById('evoLabel').innerHTML = `${c.name} стал сильнее<b>${rTo.name || ''}!</b>`;
    const parts = document.getElementById('evoParts'); parts.innerHTML = '';
    const emo = toGrade >= 5 ? ['🌟','✨','👑','💫'] : ['✨','🍃','⭐','🌰'];
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('span'); s.textContent = emo[i % emo.length];
      const a = Math.random() * 6.28, d = 90 + Math.random() * 190;
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      s.style.setProperty('--dr', (Math.random() * 720 - 360) + 'deg');
      s.style.fontSize = (14 + Math.random() * 18) + 'px';
      s.style.animationDelay = (0.85 + Math.random() * 0.3) + 's';
      parts.appendChild(s);
    }
    ov.classList.remove('on'); void ov.offsetWidth; ov.classList.add('on');
    const phone = document.querySelector('.phone');
    setTimeout(() => { phone.classList.remove('shake'); void phone.offsetWidth; phone.classList.add('shake'); }, 850);
    const close = () => { ov.classList.remove('on'); ov.onclick = null; resolve(); };
    setTimeout(() => { ov.onclick = close; }, 1600);
    setTimeout(close, 3400);
  });
}
function run(code, name, from, to) { evolveRitual({ code, name }, from, to); }
</script>
